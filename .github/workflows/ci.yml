name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pest against PostgreSQL 18
        run: make test-api

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Type check and Vitest
        run: make test-web

  stack:
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start the whole stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: |
          curl -fsSI http://localhost:8080/ | grep -qi '^content-security-policy:'
          curl -fsSI http://localhost:8080/api/health | grep -qi '^cache-control: no-store'
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:8080/ | grep -q '__nuxt'
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
